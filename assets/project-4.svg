<svg xmlns="http://www.w3.org/2000/svg" width="400" height="256" viewBox="0 0 400 256" role="img" aria-label="ML from Scratch: 14 classic ML algorithms in pure NumPy, from linear regression to DBSCAN, with interactive 3D visualisations."><title>ML from Scratch: 14 classic ML algorithms in pure NumPy, from linear regression to DBSCAN, with interactive 3D visualisations.</title>
<defs>
