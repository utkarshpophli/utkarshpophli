<svg xmlns="http://www.w3.org/2000/svg" width="830" height="260" viewBox="0 0 830 260" role="img" aria-label="About me"><title>About me</title>
<defs>
  <linearGradient id="bga" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1214"/><stop offset="1" stop-color="#0d2424"/>
  </linearGradient>
  <radialGradient id="gaa" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gba" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#0f766e" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="swa" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
    <stop offset=".5" stop-color="#5eead4" stop-opacity="1"/>
    <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cpa"><rect width="100%" height="100%" rx="16"/></clipPath>
</defs>
<style>
  .f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .in{animation:in .9s cubic-bezier(.16,1,.3,1) both}
  .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
  .d4{animation-delay:.32s}.d5{animation-delay:.40s}.d6{animation-delay:.48s}
  .d7{animation-delay:.56s}.d8{animation-delay:.64s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .drift{animation:drift 16s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-120px,40px)}}
  .sweep{animation:sweep 7s linear infinite}
  @keyframes sweep{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .role{opacity:0;animation:role 9s ease-in-out infinite both}
  .r1{opacity:1}.r2{animation-delay:3s}.r3{animation-delay:6s}
  @keyframes role{0%{opacity:0;transform:translateY(10px)}5%{opacity:1;transform:none}
    30%{opacity:1;transform:none}35%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){
    .in,.drift,.role,.pulse{animation:none}.sweep{display:none}
  }
</style><g clip-path="url(#cpa)"><rect width="830" height="260" fill="url(#bga)"/><g class="drift"><ellipse cx="705.5" cy="0" rx="456.50000000000006" ry="234.0" fill="url(#gaa)"/></g><ellipse cx="0" cy="260" rx="415.0" ry="208.0" fill="url(#gba)"/></g><rect x="0.5" y="0.5" width="829" height="259" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity="0.28"/><g class="in d1"><circle cx="46" cy="47" r="3.5" fill="#2dd4bf"/><text x="62" y="52" class="f" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">WORKING ON</text><text x="210" y="52" class="f" font-size="15" font-weight="400" fill="#d5e6e3" text-anchor="start">GenAI and agentic AI solutions as a Data Scientist at Fractal</text></g><g class="in d2"><circle cx="46" cy="83" r="3.5" fill="#2dd4bf"/><text x="62" y="88" class="f" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">COLLABORATE</text><text x="210" y="88" class="f" font-size="15" font-weight="400" fill="#d5e6e3" text-anchor="start">Open-source AI agents and LLM projects</text></g><g class="in d3"><circle cx="46" cy="119" r="3.5" fill="#2dd4bf"/><text x="62" y="124" class="f" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">HELP WANTED</text><text x="210" y="124" class="f" font-size="15" font-weight="400" fill="#d5e6e3" text-anchor="start">Growing GLOW, my vision-based Windows agent</text></g><g class="in d4"><circle cx="46" cy="155" r="3.5" fill="#2dd4bf"/><text x="62" y="160" class="f" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">LEARNING</text><text x="210" y="160" class="f" font-size="15" font-weight="400" fill="#d5e6e3" text-anchor="start">Advanced LLM evaluation and fine-tuning</text></g><g class="in d5"><circle cx="46" cy="191" r="3.5" fill="#2dd4bf"/><text x="62" y="196" class="f" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">ASK ME ABOUT</text><text x="210" y="196" class="f" font-size="15" font-weight="400" fill="#d5e6e3" text-anchor="start">LangGraph, multi-agent systems, LLMOps</text></g><g class="in d6"><circle cx="46" cy="227" r="3.5" fill="#2dd4bf"/><text x="62" y="232" class="f" font-size="11" font-weight="600" fill="#5eead4" text-anchor="start" letter-spacing="1.4">FUN FACT</text><text x="210" y="232" class="f" font-size="15" font-weight="400" fill="#d5e6e3" text-anchor="start">GLOW started as a weekend experiment</text></g></svg>