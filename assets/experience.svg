<svg xmlns="http://www.w3.org/2000/svg" width="830" height="266" viewBox="0 0 830 266" role="img" aria-label="Experience"><title>Experience</title>
<defs>
  <linearGradient id="bge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a1214"/><stop offset="1" stop-color="#0d2424"/>
  </linearGradient>
  <radialGradient id="gae" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gbe" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#0f766e" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="swe" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
    <stop offset=".5" stop-color="#5eead4" stop-opacity="1"/>
    <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cpe"><rect width="100%" height="100%" rx="16"/></clipPath>
</defs>
<style>
  .f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .in{animation:in .9s cubic-bezier(.16,1,.3,1) both}
  .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
  .d4{animation-delay:.32s}.d5{animation-delay:.40s}.d6{animation-delay:.48s}
  .d7{animation-delay:.56s}.d8{animation-delay:.64s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .drift{animation:drift 16s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-120px,40px)}}
  .sweep{animation:sweep 7s linear infinite}
  @keyframes sweep{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
  .role{opacity:0;animation:role 9s ease-in-out infinite both}
  .r1{opacity:1}.r2{animation-delay:3s}.r3{animation-delay:6s}
  @keyframes role{0%{opacity:0;transform:translateY(10px)}5%{opacity:1;transform:none}
    30%{opacity:1;transform:none}35%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
  .pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.15}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){
    .in,.drift,.role,.pulse{animation:none}.sweep{display:none}
  }
</style><g clip-path="url(#cpe)"><rect width="830" height="266" fill="url(#bge)"/><g class="drift"><ellipse cx="705.5" cy="0" rx="456.50000000000006" ry="239.4" fill="url(#gae)"/></g><ellipse cx="0" cy="266" rx="415.0" ry="212.8" fill="url(#gbe)"/></g><rect x="0.5" y="0.5" width="829" height="265" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity="0.28"/><line x1="52" y1="47" x2="52" y2="219" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="2"/><g class="in d1"><circle class="pulse" cx="52" cy="47" r="11" fill="#2dd4bf"/><circle cx="52" cy="47" r="6" fill="#2dd4bf"/><text x="80" y="52" class="f" font-size="17" font-weight="700" fill="#f0f7f6" text-anchor="start">Fractal Analytics</text><text x="80" y="73" class="f" font-size="13" font-weight="400" fill="#8fa8a6" text-anchor="start">Data Scientist, AI and Cognitive Sciences, Pune</text><text x="80" y="94" class="f" font-size="13" font-weight="400" fill="#a3bbb9" text-anchor="start">Enterprise GenAI, multi-agent orchestration, voice AI agents, Temporal + LangGraph workflows</text><text x="790" y="52" class="f" font-size="12" font-weight="600" fill="#5eead4" text-anchor="end">Now</text></g><g class="in d2"><circle cx="52" cy="123" r="5" fill="#0d2424" stroke="#5eead4" stroke-width="2"/><text x="80" y="128" class="f" font-size="17" font-weight="700" fill="#f0f7f6" text-anchor="start">Siemens R&amp;D</text><text x="80" y="149" class="f" font-size="13" font-weight="400" fill="#8fa8a6" text-anchor="start">Goa</text></g><g class="in d3"><circle cx="52" cy="177" r="5" fill="#0d2424" stroke="#5eead4" stroke-width="2"/><text x="80" y="182" class="f" font-size="17" font-weight="700" fill="#f0f7f6" text-anchor="start">Green Rider Technology</text></g><g class="in d4"><circle cx="52" cy="219" r="5" fill="#0d2424" stroke="#5eead4" stroke-width="2"/><text x="80" y="224" class="f" font-size="17" font-weight="700" fill="#f0f7f6" text-anchor="start">MITS Gwalior</text><text x="80" y="245" class="f" font-size="13" font-weight="400" fill="#8fa8a6" text-anchor="start">B.Tech, Internet of Things</text><text x="790" y="224" class="f" font-size="12" font-weight="600" fill="#5eead4" text-anchor="end">2024</text></g></svg>